<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- ضبط إعدادات العرض الخاصة بالهواتف الذكية -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Love Heart</title>
    <!-- استدعاء الخط المزخرف -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { 
            background-color: #060208; 
            overflow: hidden; 
            font-family: Arial, sans-serif;
            width: 100%;
            height: 100%;
            touch-action: manipulation;
        }
        
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #060208; display: flex; flex-direction: column; justify-content: center;
            align-items: center; z-index: 999; cursor: pointer;
            transition: opacity 0.6s ease;
            padding: 20px;
            text-align: center;
        }
        
        .title-text {
            font-family: 'Great Vibes', cursive, sans-serif;
            font-size: 13vw; /* يتجاوب تلقائياً مع حجم شاشة الهاتف */
            max-font-size: 60px;
            color: #e60d2e;
            text-shadow: 0 0 15px rgba(230, 13, 46, 0.7), 0 0 25px rgba(230, 13, 46, 0.5);
            animation: pulse 1.8s infinite ease-in-out;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .sub-text {
            color: #aaaaaa;
            font-size: 13px;
            margin-top: 15px;
            letter-spacing: 1px;
            font-family: Arial, sans-serif;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; text-shadow: 0 0 20px rgba(230, 13, 46, 0.9), 0 0 30px rgba(230, 13, 46, 0.7); }
            100% { transform: scale(1); opacity: 0.9; }
        }
        
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <!-- الشاشة الافتتاحية -->
    <div id="overlay">
        <div class="title-text">Especially Tota</div>
        <div class="sub-text">This is a confession, hope you like it For your Eyes</div>
    </div>
    
    <canvas id="canvas"></canvas>
    
    <!-- مشغل الأغنية -->
    <audio id="bgMusic" src="fy 3ny enty ahla.mp3" loop preload="auto"></audio>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height, cx, cy;
        let SC, SIZES, ROW_HEIGHT, GAP;
        
        const BG = [6/255, 2/255, 8/255];
        const FLASH = [1.0, 0.78, 0.78];
        const LIFT = 25;
        const ANIM = 42;

        const PHRASES = [
            "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
            "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
            "사랑해", "愛してる", "我爱你", "मैं तुमसे प्यार करता हूँ",
            "Σ' αγαπώ", "Ik hou van jou", "Jag älskar dig", "Kocham cię",
            "ฉันรักเธอ", "Anh yêu em", "Aku cinta kamu", "Я тебе кохаю"
        ];

        function setupMobileDimensions() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cx = width / 2;
            cy = height / 2;

            // ملاءمة حجم القلب والخطوط لشاشات الموبايل الضيقة
            const minDim = Math.min(width, height);
            SC = minDim / 36; // مقياس تجاوبي للقلب
            
            if (width < 500) { // خصائص الهواتف
                SIZES = [7, 8, 9, 10];
                ROW_HEIGHT = 16;
                GAP = 8;
            } else { // خصائص التابلت واللاب توب
                SIZES = [9, 10, 11, 12];
                ROW_HEIGHT = 22;
                GAP = 14;
            }
        }

        window.addEventListener('resize', () => {
            setupMobileDimensions();
        });
        setupMobileDimensions();

        function heart(a) {
            const x = 16 * Math.pow(Math.sin(a), 3);
            const y = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
            return [x * SC, y * SC + 10];
        }

        let POLY = [], EDGES = [], YMAX = 0, YMIN = 0, CY = 0;

        function initGeometry() {
            POLY = [];
            for (let i = 0; i < 720; i++) POLY.push(heart(2 * Math.PI * i / 720));
            YMAX = Math.max(...POLY.map(p => p[1]));
            YMIN = Math.min(...POLY.map(p => p[1]));
            CY = (YMAX + YMIN) / 2;

            EDGES = [];
            for (let i = 0; i < POLY.length; i++) {
                EDGES.push([POLY[i], POLY[(i + 1) % POLY.length]]);
            }
        }

        function spans(y) {
            let xs = [];
            for (let [[x1, y1], [x2, y2]] of EDGES) {
                if ((y1 <= y && y < y2) || (y2 <= y && y < y1)) {
                    xs.push(x1 + (y - y1) * (x2 - x1) / (y2 - y1));
                }
            }
            xs.sort((a, b) => a - b);
            let pairs = [];
            for (let i = 0; i < xs.length; i += 2) {
                if (xs[i + 1] !== undefined) pairs.push([xs[i], xs[i + 1]]);
            }
            return pairs;
        }

        function intersect(A, B) {
            let out = [];
            for (let a of A) {
                for (let b of B) {
                    let lo = Math.max(a[0], b[0]), hi = Math.min(a[1], b[1]);
                    if (hi - lo > 12) out.push([lo, hi]);
                }
            }
            return out;
        }

        function mix(a, b, k) { return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]; }
        function dim(c, k) { return [c[0] * k, c[1] * k, c[2] * k]; }
        function hx(c) { 
            const toHex = v => Math.floor(Math.max(0, Math.min(1, v)) * 255).toString(16).padStart(2, '0');
            return `#${toHex(c[0])}${toHex(c[1])}${toHex(c[2])}`;
        }
        function clamp(v) { return Math.max(0, Math.min(1, v)); }

        function build() {
            initGeometry();
            let placed = [];
            let y = YMAX - ROW_HEIGHT / 2;
            
            let cycleIdx = 0;
            const getPhrase = () => {
                let p = PHRASES[cycleIdx % PHRASES.length];
                cycleIdx++; return p;
            };

            while (y > YMIN + ROW_HEIGHT / 2) {
                let row = intersect(spans(y + ROW_HEIGHT / 2), spans(y - ROW_HEIGHT / 2));
                for (let [lo, hi] of row) {
                    lo += 4; hi -= 4;
                    let cur = lo;
                    let line = [];
                    
                    while (true) {
                        let text = getPhrase();
                        let size = SIZES[Math.floor(Math.random() * SIZES.length)];
                        ctx.font = `bold ${size}px Arial`;
                        let w = ctx.measureText(text).width;
                        
                        if (cur + w <= hi) {
                            line.push({x: cur + w / 2, text, size, w});
                            cur += w + GAP;
                        } else {
                            break;
                        }
                    }
                    if (line.length === 0) continue;

                    if (line.length > 1) {
                        let totalW = line.reduce((acc, item) => acc + item.w, 0);
                        let availableSpace = (hi - lo) - totalW;
                        let gapBetween = availableSpace / (line.length + 1);
                        let xPos = lo + gapBetween;
                        for (let i = 0; i < line.length; i++) {
                            line[i].x = xPos + line[i].w / 2;
                            xPos += line[i].w + gapBetween;
                        }
                    } else {
                        line[0].x = (lo + hi) / 2;
                    }

                    for (let i = 0; i < line.length; i++) {
                        let edge = (i === 0 || i === line.length - 1);
                        placed.push({...line[i], y, edge});
                    }
                }
                y -= ROW_HEIGHT;
            }

            const wine = [0.58, 0.0, 0.09];
            const crimson = [0.90, 0.05, 0.14];
            const blood = [0.98, 0.10, 0.16];

            for (let p of placed) {
                let rad = Math.min(1.0, Math.hypot(p.x / (16 * SC), (p.y - CY) / (14.5 * SC)));
                let base = mix(wine, crimson, 0.25 + 0.75 * rad);
                base = mix(base, blood, Math.random() * 0.35 + (p.edge ? 0.3 : 0));
                p.color = base;
                p.rad = rad;
            }

            let edges = placed.filter(p => p.edge).sort((a, b) => (Math.atan2(a.x, a.y - CY) % (2 * Math.PI)) - (Math.atan2(b.x, b.y - CY) % (2 * Math.PI)));
            let inner = placed.filter(p => !p.edge).sort((a, b) => -a.rad + Math.random() * 0.08);
            
            return edges.concat(inner);
        }

        let ORDER = [];
        let activeItems = [];
        let settledItems = [];
        let itemsIter = 0;
        let isSpawning = true;
        let RATE = 1.2; 
        let acc = 0.0;

        function spawn(p) {
            p.f = 0;
            p.dx = (Math.random() - 0.5) * 12;
            activeItems.push(p);
        }

        function draw() {
            ctx.fillStyle = '#060208';
            ctx.fillRect(0, 0, width, height);

            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            for (let p of settledItems) {
                let col = p.color;
                if (p.shimmer > 0) {
                    col = mix(p.color, FLASH, p.shimmer * 0.6);
                    p.shimmer -= 0.04;
                }
                ctx.font = `bold ${p.size}px Arial`;
                ctx.fillStyle = hx(col);
                ctx.fillText(p.text, cx + p.x, cy - p.y);
            }

            if (isSpawning) {
                acc += RATE;
                while (acc >= 1 && itemsIter < ORDER.length) {
                    acc -= 1;
                    spawn(ORDER[itemsIter++]);
                }
                if (itemsIter >= ORDER.length) isSpawning = false;
            }

            for (let i = activeItems.length - 1; i >= 0; i--) {
                let p = activeItems[i];
                p.f += 1;
                let u = clamp(p.f / ANIM);
                let e = 1 - Math.pow(1 - u, 3);
                
                let hover = (1 - e) * LIFT;
                let px = cx + p.x + p.dx * (1 - e);
                let py = cy - p.y - hover;

                let flash = 0.75 * Math.sin(Math.PI * clamp((u - 0.55) / 0.45));
                let col = mix(mix(BG, p.color, Math.pow(e, 1.5)), FLASH, flash);
                
                ctx.font = `bold ${p.size}px Arial`;
                ctx.fillStyle = hx(col);
                ctx.fillText(p.text, px, py);

                if (u >= 1) {
                    settledItems.push(p);
                    activeItems.splice(i, 1);
                }
            }

            if (!isSpawning && Math.random() < 0.08 && settledItems.length > 0) {
                let rItem = settledItems[Math.floor(Math.random() * settledItems.length)];
                rItem.shimmer = 1.0;
            }

            requestAnimationFrame(draw);
        }

        const startAction = function() {
            document.getElementById('overlay').style.opacity = '0';
            setTimeout(() => document.getElementById('overlay').style.display = 'none', 600);
            
            ORDER = build();
            const music = document.getElementById('bgMusic');
            music.play().catch(e => console.log("تأكد من وجود ملف الصوت"));
            draw();
        };

        document.getElementById('overlay').addEventListener('click', startAction);
        document.getElementById('overlay').addEventListener('touchstart', startAction, {passive: true});
    </script>
</body>
</html>
